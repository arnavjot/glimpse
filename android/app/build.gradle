plugins {
    id 'com.android.application'
    id 'androidx.baselineprofile'
}

// Firebase (push notifications). google-services.json comes from your Firebase project
// and is git-ignored. Without it the app still builds and runs, with push turned off,
// so CI and fresh clones don't need Firebase credentials.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.arnavjot.glimpse'
    compileSdk 35

    defaultConfig {
        applicationId 'com.arnavjot.glimpse'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // 10.0.2.2 is the host machine as seen from the Android emulator. On a real
        // phone, change it in the app's Settings to your computer's LAN address.
        buildConfigField 'String', 'DEFAULT_API_URL', '"http://10.0.2.2:8080/"'
        // Share links: set glimpseShareHost in gradle.properties to the domain serving the
        // backend over HTTPS (e.g. glimpse.example.com). Links become https://<host>/v/<id>
        // and open the app directly (App Links). Empty: links use the API address, which
        // works on the same network only; the App Links filter then gets a reserved
        // .invalid host that can never match.
        def shareHost = (project.findProperty('glimpseShareHost') ?: '').toString().trim()
        buildConfigField 'String', 'SHARE_BASE_URL', shareHost ? "\"https://${shareHost}/\"" : '""'
        manifestPlaceholders = [shareHost: shareHost ?: 'share.invalid']

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ['room.schemaLocation': "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed with the debug key so the release build installs for benchmarking.
            // Use a real upload key before publishing.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    lint {
        abortOnError true
        warningsAsErrors false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'

    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle"
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle"
    implementation "androidx.lifecycle:lifecycle-process:$lifecycle"

    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation "androidx.media3:media3-datasource:$media3"
    implementation "androidx.media3:media3-database:$media3"

    implementation "androidx.room:room-runtime:$room"
    annotationProcessor "androidx.room:room-compiler:$room"
    implementation "androidx.work:work-runtime:$work"

    implementation "com.google.dagger:dagger:$dagger"
    annotationProcessor "com.google.dagger:dagger-compiler:$dagger"

    implementation "com.squareup.retrofit2:retrofit:$retrofit"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit"
    implementation "com.squareup.okhttp3:okhttp:$okhttp"
    implementation "com.squareup.okhttp3:logging-interceptor:$okhttp"
    implementation "com.github.bumptech.glide:glide:$glide"

    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    // Deferred deep links: the clip a Play Store install came from.
    implementation 'com.android.installreferrer:installreferrer:2.2'

    baselineProfile project(':benchmark')

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation "androidx.room:room-testing:$room"
    testImplementation "androidx.work:work-testing:$work"
    testImplementation "com.squareup.okhttp3:mockwebserver:$okhttp"
    testImplementation 'com.google.truth:truth:1.4.4'
}
