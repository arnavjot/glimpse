server {
    listen 80;
    # The media volume is mounted at /usr/share/nginx/media, so /media/v001/x.ts
    # maps to /usr/share/nginx/media/v001/x.ts. nginx's default mime.types
    # already knows .m3u8 and .ts; Range requests work out of the box.
    root /usr/share/nginx;
    sendfile on;
    tcp_nopush on;

    # Segments and posters never change once generated: let the app's disk cache
    # (and any CDN in front) keep them for a year.
    location ~* ^/media/.+\.(ts|jpg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # VOD playlists are fixed too, but keep them shorter-lived.
    location ~* ^/media/.+\.m3u8$ {
        add_header Cache-Control "public, max-age=3600";
    }

    location /media/ {
        autoindex off;
    }

    # Everything else is the API. nginx is the only way in from outside, and it records
    # who connected: X-Forwarded-For is overwritten with the address nginx sees, so
    # whatever a client puts in that header itself is thrown away. (With a load balancer
    # in front of nginx, use set_real_ip_from for it here.)
    location / {
        # Looked up through Docker's DNS on each request (cached 10 s), so restarting the
        # API, which can give it a new address, doesn't leave nginx pointing at the old one.
        resolver 127.0.0.11 valid=10s;
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 2m;   # API bodies are small JSON; video goes straight to storage
    }
}
