name: glimpse

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: glimpse
      POSTGRES_PASSWORD: glimpse
      POSTGRES_DB: glimpse
    # Exposed on localhost so the server can also run from the IDE.
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glimpse"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  # One-shot: build the clip library (skipped if media/manifest.json exists).
  # Video files in ./media-src (stock footage, phone clips) are converted to HLS;
  # with none there, synthetic demo clips are generated instead.
  media:
    image: alpine:3.20
    volumes: [./media:/work/media, ./media-src:/work/media-src:ro, ./scripts:/work/scripts:ro]
    working_dir: /work
    command: sh scripts/build_media.sh

  # S3-compatible object storage for original uploads (phones PUT straight here).
  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes: [s3data:/data, ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro]
    ports: ["8333:8333"]

  api:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/glimpse
      REDIS_URL: redis://redis:6379
      SEED_MANIFEST: /srv/media/manifest.json
      SPONSORED_MANIFEST: /srv/media/sponsored.json
      # Push (Firebase Cloud Messaging): put the service-account JSON at
      # backend/secrets/firebase.json. Missing file: push is off.
      FIREBASE_CREDENTIALS: /run/secrets/firebase.json
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Developer pages such as /dev/deeplink-test: on for local runs only.
      DEV_TOOLS: "true"
      S3_ENDPOINT: http://seaweedfs:8333
      # What phones upload to: your computer's LAN address (pre-signed URLs are signed for it).
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://10.0.2.2:8333}
      S3_ACCESS_KEY: glimpse
      S3_SECRET_KEY: glimpse-dev-secret
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me-0123456789}
      # Where the phone fetches video from. 10.0.2.2 is the host as seen from
      # the Android emulator; on a real phone use your computer's LAN address.
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-http://10.0.2.2:8080/media}
      # Only nginx may say who the client is (its fixed address below).
      TRUSTED_PROXY: 172\.28\.0\.10
    volumes: [./media:/srv/media:ro, ./secrets:/run/secrets:ro]
    # Phones and browsers come in through nginx on 8080. 8000 is for tools on this computer.
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      media: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8000'"]
      interval: 5s
      retries: 30

  # The upload worker: the same image with WORKER_ENABLED=true. Claims jobs from Postgres,
  # transcodes with ffmpeg and writes HLS into ./media (nginx serves it). Scale it with
  # `docker compose up -d --scale worker=3`: workers share the queue safely.
  worker:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/glimpse
      REDIS_URL: redis://redis:6379
      WORKER_ENABLED: "true"
      MEDIA_DIR: /srv/media
      SEED_MANIFEST: does-not-exist.json
      SPONSORED_MANIFEST: does-not-exist.json
      S3_ENDPOINT: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://10.0.2.2:8333}
      S3_ACCESS_KEY: glimpse
      S3_SECRET_KEY: glimpse-dev-secret
      SERVER_PORT: "8001"
    volumes: [./media:/srv/media]
    depends_on:
      api: {condition: service_healthy}
      seaweedfs: {condition: service_started}

  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    networks:
      default:
        ipv4_address: 172.28.0.10
    volumes:
      - ./media:/usr/share/nginx/media:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  prometheus:
    image: prom/prometheus:v2.53.0
    ports: ["127.0.0.1:9090:9090"]
    volumes: [./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro]

  grafana:
    image: grafana/grafana:11.1.0
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  pgdata:
  s3data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
